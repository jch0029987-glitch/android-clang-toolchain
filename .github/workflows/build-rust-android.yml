name: Build Rust Android Toolchain

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Rust Version or Channel (e.g. stable, 1.80.0)'
        required: true
        default: 'stable'
        type: string

permissions:
  contents: write

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rustup & Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ inputs.rust_version }}

      - name: Package Rust Executables and Sysroot
        run: |
          PKG_DIR=$HOME/rust_pkg
          mkdir -p $PKG_DIR/jniLibs/arm64-v8a
          mkdir -p $PKG_DIR/lib/rustlib

          # 1. Copy and rename Rust binaries to .so for nativeLibraryDir execution
          cp $(which cargo) $PKG_DIR/jniLibs/arm64-v8a/libcargo_exec.so
          cp $(which rustc) $PKG_DIR/jniLibs/arm64-v8a/librustc_exec.so

          # 2. Copy the Rust standard library sysroot components
          RUSTC_SYSROOT=$(rustc --print sysroot)
          cp -r $RUSTC_SYSROOT/lib/* $PKG_DIR/lib/

          # 3. Compress into a release archive
          cd $PKG_DIR
          tar -cJf $HOME/rust-toolchain-bundle.tar.xz jniLibs lib

      - name: Create GitHub Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="rust-toolchain-${{ inputs.rust_version }}-${{ github.run_number }}"
          ARCHIVE_PATH="$HOME/rust-toolchain-bundle.tar.xz"
          
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$ARCHIVE_PATH" \
            --title "Rust Toolchain (${{ inputs.rust_version }})" \
            --notes "Pure Rust toolchain bundle with .so executables and standard library sysroot."
