name: Build Native Android Rust Toolchain

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Rust Version (e.g. 1.80.0, stable)'
        required: true
        default: 'stable'
        type: string
      ndk_version:
        description: 'Target Android NDK Version'
        required: true
        default: 'r29'
        type: choice
        options:
          - 'r29'
          - 'r28'
          - 'r26b'

permissions:
  contents: write

jobs:
  build-android-rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rustup & Android Target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ inputs.rust_version }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk_version }}
          add-to-path: true

      - name: Initialize Cargo Workspace for Cross-Compilation
        run: |
          cargo init --name android_toolchain_builder --bin --vcs none

      - name: Cross-Compile Toolchain for aarch64-linux-android
        run: |
          NDK_TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          API_LEVEL=26
          
          export CC_aarch64_linux_android="$NDK_TOOLCHAIN/bin/aarch64-linux-android$API_LEVEL-clang"
          export AR_aarch64_linux_android="$NDK_TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"

          echo "Cross-compiling binaries for Android ARM64..."
          cargo build --target aarch64-linux-android --release

      - name: Package Android Binaries & Sysroot
        run: |
          PKG_DIR=$HOME/rust_pkg
          mkdir -p $PKG_DIR/jniLibs/arm64-v8a
          mkdir -p $PKG_DIR/lib/rustlib/aarch64-linux-android

          # Map compiled binary output to jniLibs execution names
          if [ -f "target/aarch64-linux-android/release/android_toolchain_builder" ]; then
            cp target/aarch64-linux-android/release/android_toolchain_builder $PKG_DIR/jniLibs/arm64-v8a/libcargo_exec.so
            cp target/aarch64-linux-android/release/android_toolchain_builder $PKG_DIR/jniLibs/arm64-v8a/librustc_exec.so
          fi

          chmod +x $PKG_DIR/jniLibs/arm64-v8a/*.so

          # Download target standard libraries for ARM64 Android
          RUST_VER="${{ inputs.rust_version }}"
          if [ "$RUST_VER" = "stable" ]; then
            RUST_VER=$(rustc --version | awk '{print $2}')
          fi
          
          curl -L -O "https://static.rust-lang.org/dist/rust-std-$RUST_VER-aarch64-linux-android.tar.gz"
          tar -xzf rust-std-$RUST_VER-aarch64-linux-android.tar.gz
          cp -r rust-std-$RUST_VER-aarch64-linux-android/rust-std-aarch64-linux-android/lib/rustlib/aarch64-linux-android/* $PKG_DIR/lib/rustlib/aarch64-linux-android/

          cd $PKG_DIR
          tar -cJf $HOME/rust-android-arm64-bundle.tar.xz jniLibs lib

      - name: Create GitHub Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="rust-android-arm64-${{ github.run_number }}"
          gh release create "$TAG_NAME" "$HOME/rust-android-arm64-bundle.tar.xz" \
            --title "Native Android Rust Toolchain Bundle" \
            --notes "Cross-compiled on x86_64 Linux runner targeting aarch64-linux-android with NDK ${{ inputs.ndk_version }}."
