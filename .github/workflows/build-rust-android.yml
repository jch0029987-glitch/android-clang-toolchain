name: Build Native Android Rust Toolchain

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Rust Version or Channel (e.g. stable, 1.80.0)'
        required: true
        default: 'stable'
        type: string
      ndk_version:
        description: 'Target Android NDK Version'
        required: true
        default: 'r29'
        type: choice
        options:
          - 'r29'
          - 'r28'
          - 'r26b'

permissions:
  contents: write

jobs:
  build-android-rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rustup & Target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ inputs.rust_version }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: ${{ inputs.ndk_version }}
          add-to-path: true

      - name: Cross-Compile Cargo & Rustc for Android (aarch64-linux-android)
        run: |
          # Configure Cargo to use the Android NDK Clang compiler wrapper for aarch64-linux-android
          NDK_TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          API_LEVEL=26
          
          export CC_aarch64_linux_android="$NDK_TOOLCHAIN/bin/aarch64-linux-android$API_LEVEL-clang"
          export AR_aarch64_linux_android="$NDK_TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"

          echo "Building standalone Cargo and Rustc for Android..."
          # Clone or fetch rust source/tools to build, or cross-compile your cargo/rust components
          # Alternatively, build a self-contained cargo wrapper or download prebuilt Android binaries of cargo/rustc
          cargo build --target aarch64-linux-android --release -p cargo -p rustc

      - name: Package Android Binaries and Sysroot
        run: |
          PKG_DIR=$HOME/rust_pkg
          mkdir -p $PKG_DIR/jniLibs/arm64-v8a
          mkdir -p $PKG_DIR/lib/rustlib

          # Copy the actual NDK-compiled Android binaries
          cp target/aarch64-linux-android/release/cargo $PKG_DIR/jniLibs/arm64-v8a/libcargo_exec.so
          cp target/aarch64-linux-android/release/rustc $PKG_DIR/jniLibs/arm64-v8a/librustc_exec.so

          # Set executable permissions in the archive
          chmod +x $PKG_DIR/jniLibs/arm64-v8a/*.so

          # Compress into release bundle
          cd $PKG_DIR
          tar -cJf $HOME/rust-android-${{ inputs.rust_version }}-${{ inputs.ndk_version }}-arm64.tar.xz jniLibs lib

      - name: Create GitHub Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="rust-android-${{ inputs.rust_version }}-${{ inputs.ndk_version }}-${{ github.run_number }}"
          ARCHIVE_PATH="$HOME/rust-android-${{ inputs.rust_version }}-${{ inputs.ndk_version }}-arm64.tar.xz"
          
          gh release create "$TAG_NAME" "$ARCHIVE_PATH" \
            --title "Native Android Rust Toolchain (${{ inputs.rust_version }})" \
            --notes "Cargo and Rustc cross-compiled specifically for aarch64-linux-android using NDK ${{ inputs.ndk_version }}."
