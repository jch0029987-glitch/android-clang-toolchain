name: Build Native Android Rust Toolchain

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Rust Version (e.g. 1.80.0, stable)'
        required: true
        default: 'stable'
        type: string
      ndk_version:
        description: 'Target Android NDK Version'
        required: true
        default: 'r29'
        type: choice
        options:
          - 'r29'
          - 'r28'
          - 'r26b'

permissions:
  contents: write

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rustup & Android Target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ inputs.rust_version }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk_version }}
          add-to-path: true

      - name: Download Official Android Rust Standard Library Tarball
        run: |
          RUST_VER="${{ inputs.rust_version }}"
          if [ "$RUST_VER" = "stable" ]; then
            RUST_VER=$(rustc --version | awk '{print $2}')
          fi
          
          echo "Fetching rust-std for aarch64-linux-android ($RUST_VER)..."
          curl -L -O "https://static.rust-lang.org/dist/rust-std-$RUST_VER-aarch64-linux-android.tar.gz"
          tar -xzf rust-std-$RUST_VER-aarch64-linux-android.tar.gz

      - name: Package Toolchain Bundle for Android
        run: |
          PKG_DIR=$HOME/rust_pkg
          mkdir -p $PKG_DIR/jniLibs/arm64-v8a
          mkdir -p $PKG_DIR/lib/rustlib/aarch64-linux-android

          # Copy target sysroot libraries into place
          cp -r rust-std-*-aarch64-linux-android/rust-std-aarch64-linux-android/lib/rustlib/aarch64-linux-android/* $PKG_DIR/lib/rustlib/aarch64-linux-android/

          # Create placeholder executable shims or cross-compiled static drivers
          # (These will be mapped to your jniLibs for execution via your BinaryExtractor)
          touch $PKG_DIR/jniLibs/arm64-v8a/libcargo_exec.so
          touch $PKG_DIR/jniLibs/arm64-v8a/librustc_exec.so
          chmod +x $PKG_DIR/jniLibs/arm64-v8a/*.so

          cd $PKG_DIR
          tar -cJf $HOME/rust-android-bundle.tar.xz jniLibs lib

      - name: Create GitHub Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="rust-android-bundle-${{ github.run_number }}"
          gh release create "$TAG_NAME" "$HOME/rust-android-bundle.tar.xz" \
            --title "Android Rust Toolchain Bundle" \
            --notes "Includes native aarch64-linux-android standard library sysroot and jniLibs structure."
