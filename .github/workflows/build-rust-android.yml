name: Build Rust Android ARM64 Toolchain

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Rust Version or Channel (e.g. stable, 1.80.0)'
        required: true
        default: 'stable'
        type: string
      ndk_version:
        description: 'Target Android NDK Version (for consistency)'
        required: true
        default: 'r29'
        type: choice
        options:
          - 'r29'
          - 'r28'
          - 'r26b'

permissions:
  contents: write

jobs:
  build-rust-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rustup & ARM64 Host Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ inputs.rust_version }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-linux-android

      - name: Package ARM64 Rust Executables and Sysroot
        run: |
          PKG_DIR=$HOME/rust_pkg
          mkdir -p $PKG_DIR/jniLibs/arm64-v8a
          mkdir -p $PKG_DIR/lib/rustlib

          # 1. Copy and rename native ARM64 Rust binaries to .so for nativeLibraryDir execution
          cp $(which cargo) $PKG_DIR/jniLibs/arm64-v8a/libcargo_exec.so
          cp $(which rustc) $PKG_DIR/jniLibs/arm64-v8a/librustc_exec.so

          # 2. Copy the ARM64 Rust standard library target components for Android
          RUSTC_SYSROOT=$(rustc --print sysroot)
          cp -r $RUSTC_SYSROOT/lib/* $PKG_DIR/lib/

          # 3. Compress into a release archive
          cd $PKG_DIR
          tar -cJf $HOME/rust-${{ inputs.rust_version }}-${{ inputs.ndk_version }}-arm64-bundle.tar.xz jniLibs lib

      - name: Create GitHub Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="rust-${{ inputs.rust_version }}-${{ inputs.ndk_version }}-${{ github.run_number }}"
          ARCHIVE_PATH="$HOME/rust-${{ inputs.rust_version }}-${{ inputs.ndk_version }}-arm64-bundle.tar.xz"
          
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" "$ARCHIVE_PATH" \
            --title "Rust (${{ inputs.rust_version }}) + NDK (${{ inputs.ndk_version }})" \
            --notes "ARM64 Rust toolchain bundle matched with NDK ${{ inputs.ndk_version }} target expectations."
