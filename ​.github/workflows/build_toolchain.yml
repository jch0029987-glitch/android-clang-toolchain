name: Build Android Clang Toolchain (.so Bundle)

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract Android NDK
        run: |
          echo "Downloading Android NDK r26b..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          mv android-ndk-r26b $HOME/ndk

      - name: Package and Rename Binaries for nativeLibraryDir
        run: |
          NDK_PATH=$HOME/ndk
          BUILD_DIR=$HOME/toolchain_pkg
          
          # Create folder structure for your app's jniLibs and assets
          mkdir -p $BUILD_DIR/jniLibs/arm64-v8a
          mkdir -p $BUILD_DIR/sysroot
          
          # Path to prebuilt LLVM binaries inside the NDK (Linux x86_64 host runner targeting Android)
          LLVM_BIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          # Rename executables to .so format so Android extracts them into nativeLibraryDir with execute permissions
          echo "Renaming and copying compiler binaries..."
          cp $LLVM_BIN/clang $BUILD_DIR/jniLibs/arm64-v8a/libclang_exec.so
          cp $LLVM_BIN/clang++ $BUILD_DIR/jniLibs/arm64-v8a/libclangxx_exec.so
          cp $LLVM_BIN/lld $BUILD_DIR/jniLibs/arm64-v8a/liblld_exec.so
          
          # Copy Unified NDK Sysroot Headers and Libraries (<stdio.h>, <vector>, etc.)
          echo "Copying sysroot headers and libraries..."
          cp -r $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/* $BUILD_DIR/sysroot/
          
          # Compress everything into a release bundle tarball
          echo "Creating final tarball package..."
          cd $BUILD_DIR
          tar -cJf $HOME/clang-toolchain-so-bundle.tar.xz jniLibs sysroot
          echo "Build and packaging complete."

      - name: Create GitHub Release and Upload Artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "Clang .so Toolchain Bundle v1.1.${{ github.run_number }}"
          body: |
            Automated toolchain build:
            - Clang/LLD binaries renamed to `.so` for direct placement into `jniLibs/arm64-v8a/` (bypasses W^X execution restrictions).
            - Unmodified NDK sysroot headers for extraction into app private storage (`filesDir`).
          files: |
            /home/runner/clang-toolchain-so-bundle.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
